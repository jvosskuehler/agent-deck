name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Prüfen und Testen
    # Muss Windows sein: das Deck ist Windows-only (Win32, Tauri mit WebView2), und
    # einige Tests lesen lesend gegen das echte System (Monitore, Prozessliste).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Wie lokal (app/package.json hat kein packageManager-Feld).
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Oberfläche installieren
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Oberfläche bauen (Typprüfung + Vite)
        # Vor cargo: `tauri::generate_context!` bettet app/dist beim Übersetzen ein.
        working-directory: app
        run: pnpm build

      - name: Oberflächen-Tests
        working-directory: app
        run: pnpm test

      - name: Extension-Tests
        # Node allein, ohne VS Code und ohne npm-Pakete. Ein Muster statt des Ordners:
        # seit Node 21 nimmt `--test` Glob-Muster, ein nackter Ordnername wird als
        # Datei gesucht und scheitert. Die Anfuehrungszeichen lassen das Muster bei Node.
        run: node --test "extension/test/*.test.js"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Rust-Tests
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: PowerShell-Skripte parsen
        # tools/install.ps1 ist der Weg auf den Rechner. Ein Tippfehler darin fällt sonst
        # erst beim nächsten Installieren auf.
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Filter *.ps1 -Path tools, resources
          $fehler = @()
          foreach ($f in $files) {
            $t = $null; $e = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$t, [ref]$e) | Out-Null
            if ($e) { $fehler += "$($f.Name): $($e -join '; ')" }
          }
          if ($fehler) { $fehler | ForEach-Object { Write-Host $_ }; exit 1 }
          Write-Host "ok: $($files.Count) Skript(e) parsen fehlerfrei"
