# Ziel der aus Rust erzeugten TypeScript-Typen (ts-rs), relativ zur Workspace-Wurzel.
[env]
TS_RS_EXPORT_DIR = { value = "app/src/bindings", relative = true }

# C-Laufzeit statisch einbinden: auf einem frischen Windows fehlt VCRUNTIME140.dll
# (gemessen 17.11.2026 auf Server 2025, 0xC0000135), dann startet weder deck-setup
# noch ein Hook. Mit crt-static braucht das Paket kein VC++-Redistributable.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# Die Hooks auch als Linux-Programme für Agenten in WSL (tools/package.ps1): statisch gegen
# musl, gelinkt mit dem lld, den Rust mitbringt. So baut auch ein Windows-Rechner ohne
# WSL, gcc oder zig (rustup target add x86_64-unknown-linux-musl genügt).
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
