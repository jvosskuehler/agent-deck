[package]
name = "deck-win"
description = "Win32-Schicht des Agent Deck: Fenster, Monitore, DPI, Prozesse, Konsolen-Eingabe, Overlay, Tastenkürzel"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# Der Wegwerfprozess für Tasten in fremde Konsolen (siehe src/console_input.rs).
# Er muss neben der App ausgeliefert werden; console_input::helper_path sucht ihn dort.
[[bin]]
name = "deck-console"
path = "src/bin/deck-console.rs"

[dependencies]
thiserror = "2.0.21"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
